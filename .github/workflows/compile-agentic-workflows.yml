name: Compile Agentic Workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.md'
      - '.github/workflows/shared/**/*.md'
      - '.github/workflows/shared/*.md'
      - '.github/workflows/compile-agentic-workflows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compile-agentic-workflows
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout workflow sources only
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            .github/aw.json
            aw.json

      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw

      - name: Compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile

      - name: Commit generated locks
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows; then
            echo 'No generated workflow changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'chore(gh-aw): compile agentic workflow locks'
          git push
