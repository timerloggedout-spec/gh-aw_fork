name: Compile Agentic Workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**/*.md'
      - '.github/workflows/*.md'
      - '.github/workflows/shared/**'
      - '.github/workflows/compile-agentic-workflows.yml'
      - '.github/skills/**'
      - '.github/agents/**'
      - '.github/graders/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-agentic-workflows
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout workflow sources and imports
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            .github/aw.json
            aw.json
            .github/skills
            .github/agents
            .github/graders

      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw

      - name: Compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile

      - name: Upload generated workflow locks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gh-aw-generated-workflow-locks-${{ github.run_id }}
          path: .github/workflows/**/*.lock.yml
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit generated locks when an authorized workflow token is configured
        if: ${{ success() && secrets.GH_AW_WORKFLOW_TOKEN != '' }}
        env:
          GH_AW_WORKFLOW_TOKEN: ${{ secrets.GH_AW_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows; then
            echo 'No generated workflow changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'chore(gh-aw): compile agentic workflow locks'
          git push "https://x-access-token:${GH_AW_WORKFLOW_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Report lock commit mode
        if: ${{ success() && secrets.GH_AW_WORKFLOW_TOKEN == '' }}
        run: |
          echo 'Compilation succeeded. Generated locks were uploaded as an artifact.'
          echo 'Automatic lock commits require GH_AW_WORKFLOW_TOKEN with workflow-write authorization.'
