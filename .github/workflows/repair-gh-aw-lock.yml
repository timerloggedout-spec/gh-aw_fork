name: Repair gh-aw lock

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  compile:
    if: ${{ !contains(github.event.head_commit.message, '[gh-aw-lock-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gh-aw
        run: gh extension install github/gh-aw

      - name: Recompile breaking-change-checker
        run: gh aw compile breaking-change-checker

      - name: Commit generated lock and remove repair workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-gh-aw-lock.yml
          git add .github/workflows/breaking-change-checker.lock.yml .github/workflows/shared/otlp.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "fix(gh-aw): compile optional OTLP gateway configuration [gh-aw-lock-repair]"
          git push
